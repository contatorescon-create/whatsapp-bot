# fly.toml app configuration file generated for resconfi-whatsapp on 2026-10-22T11:54:31-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'resconfi-whatsapp'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  AUTH_DIR = '/data/auth_info'
  PORT = '3000'

[[mounts]]
  source = 'wa_sessao'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
